name: Android CI Build

# Android CI for LifeOS.
# Keep SDK setup explicit: the legacy `tools` SDK package no longer exists,
# so setup-android is told not to install its default packages and sdkmanager
# installs only the packages required by compileSdk/targetSdk.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # Matches sourceCompatibility/targetCompatibility/jvmTarget = 17
        # in app/build.gradle.kts.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # setup-android@v4 is used explicitly; do not request the obsolete
        # legacy `tools` SDK package.
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        # app/build.gradle.kts uses compileSdk/targetSdk 35.
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (version pinned to match gradle-wrapper.properties)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build test, debug and release
        # Unit tests run first; then both APK variants are assembled.
        # Release falls back to debug signing when keystore.properties is
        # absent (see app/build.gradle.kts), so CI stays green while real
        # releases still require a proper keystore.
        run: gradle test assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
